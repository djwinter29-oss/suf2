name: Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - 'tools/firmware/**'
      - 'host/python/**'
      - '.gitmodules'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'tools/firmware/**'
      - 'host/python/**'
      - '.gitmodules'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Library and loader simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Mbed TLS
        run: git submodule update --init --depth 1 firmware/lib/mbedtls
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          python -m pip install cryptography
      - name: Library tests
        run: |
          cmake -S firmware/suf2 -B build/suf2-native -G Ninja
          cmake --build build/suf2-native
          ctest --test-dir build/suf2-native --output-on-failure
      - name: Loader simulation tests
        run: |
          cmake -S firmware/boards/rp2-common/tests -B build/rp2-sim -G Ninja
          cmake --build build/rp2-sim
          ctest --test-dir build/rp2-sim --output-on-failure

  boards:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [rp2040, rp2350]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch libraries
        run: |
          git submodule update --init --depth 1 firmware/lib/mbedtls firmware/lib/pico-sdk
          git -C firmware/lib/pico-sdk submodule update --init --depth 1 lib/tinyusb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          python -m pip install cryptography
      - name: Generate test keys
        run: python host/shared/generate-test-keys.py
      - name: Build
        run: |
          cmake -S firmware/boards/${{ matrix.board }} -B build/${{ matrix.board }} -G Ninja \
                -DSUF2_SIGNING_KEY=$PWD/host/shared/local/signing-private.pem
          cmake --build build/${{ matrix.board }}
      - name: Production build refuses test keys
        run: |
          if cmake -S firmware/boards/${{ matrix.board }} -B build/prod -G Ninja \
                   -DSUF2_PRODUCTION=ON \
                   -DSUF2_TRUSTED_KEYS=$PWD/host/shared/local/signing-public.pem \
                   -DSUF2_PRODUCT_ID=00112233445566778899aabbccddeeff; then
            echo "production configure should have failed"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: suf2-${{ matrix.board }}
          path: |
            build/${{ matrix.board }}/suf2_loader.uf2
            build/${{ matrix.board }}/suf2_loader.elf
            build/${{ matrix.board }}/blink/blink.suf2
          if-no-files-found: error
