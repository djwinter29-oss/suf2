name: Dashboard Pages

on:
  push:
    branches: [main, master]
    paths:
      - "host/dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

# GitHub Pages serves the gh-pages branch, so this job replaces that branch
# with the public dashboard files only (no tests, sources or keys).
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript
        run: npm --prefix host/dashboard run checks
      - name: Test packer and inputs
        run: npm --prefix host/dashboard test
      - name: Stage public dashboard assets only
        run: |
          mkdir public-dashboard
          cp host/dashboard/index.html host/dashboard/styles.css \
            host/dashboard/app.js host/dashboard/input.js \
            host/dashboard/packer.js host/dashboard/.nojekyll public-dashboard/
      - name: Publish to gh-pages
        working-directory: public-dashboard
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish dashboard from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
