name: Publish .NET CLI

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag in vMAJOR.MINOR.PATCH form"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to stamp, for example v1.2.3 (does not create a tag or release)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: .NET CLI (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=$(tools/release/resolve-release-version.sh "$TAG")" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained CLI
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish host/dotnet/Suf2.csproj -c Release -r "$RID" --self-contained true \
            -p:Version="$VERSION" -o build/dotnet-release

      - name: Archive, smoke-test and checksum
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m pip install cryptography
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile
          version, rid = os.environ['VERSION'], os.environ['RID']
          dist = Path('dist')
          dist.mkdir(exist_ok=True)
          archive_format = 'zip' if rid.startswith('win-') else 'gztar'
          archive = shutil.make_archive(str(dist / f'suf2-dotnet-v{version}-{rid}'), archive_format,
                                        root_dir='build/dotnet-release')
          # Test the archive users download, not the build folder.
          with tempfile.TemporaryDirectory() as directory:
              shutil.unpack_archive(archive, directory)
              executable = Path(directory) / 'suf2'
              if executable.exists():
                  executable.chmod(0o755)
              subprocess.run([sys.executable, 'tools/release/check-dotnet-host.py', directory,
                              '--version', version], check=True, timeout=120)
          files = sorted(path for path in dist.iterdir() if path.is_file())
          checksums = ''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in files)
          (dist / f'SHA256SUMS-dotnet-{rid}.txt').write_text(checksums, encoding='utf-8')
          PY

      - name: Upload .NET package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dotnet-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
