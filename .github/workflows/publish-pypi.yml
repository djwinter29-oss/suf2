name: Publish Python to PyPI

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, for example v1.2.3"
        required: false
        type: string
      test_publish:
        description: "Publish a public, permanent development version from the selected commit"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: pypi-${{ inputs.test_publish && github.ref || github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify released wheel
    if: >-
      (github.event_name != 'workflow_dispatch' || !inputs.test_publish) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate published release and download wheel
        id: release
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(tools/release/resolve-release-version.sh "$RELEASE_TAG")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false')" = true
          python3 tools/release/require_release_checks.py --tag "$RELEASE_TAG" --expected-sha "$SOURCE_SHA"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'suf2_host-*-py3-none-any.whl' --pattern SHA256SUMS-python.txt --dir incoming

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify wheel checksum and metadata
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          import hashlib
          import os
          from pathlib import Path
          import shutil
          from zipfile import ZipFile
          version = os.environ['VERSION']
          incoming = Path('incoming')
          wheels = list(incoming.glob('*.whl'))
          assert len(wheels) == 1, 'expected exactly one released wheel'
          wheel = wheels[0]
          assert wheel.name == f'suf2_host-{version}-py3-none-any.whl', 'wheel name does not match the release'
          checksums = dict(line.split(maxsplit=1)[::-1]
                           for line in (incoming / 'SHA256SUMS-python.txt').read_text().splitlines())
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == checksums.get(wheel.name), 'wheel checksum mismatch'
          with ZipFile(wheel) as archive:
              metadata = BytesParser().parsebytes(archive.read(f'suf2_host-{version}.dist-info/METADATA'))
          assert metadata['Name'] == 'suf2-host', 'unexpected package name'
          assert metadata['Version'] == version, 'package version does not match the release'
          Path('dist').mkdir()
          shutil.copyfile(wheel, Path('dist') / wheel.name)
          PY

      - name: Upload verified wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-distribution
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish verified wheel
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/suf2-host/
    steps:
      - name: Download verified wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distribution
          path: dist

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  test-package:
    name: Build development wheel
    if: github.event_name == 'workflow_dispatch' && inputs.test_publish
    runs-on: ubuntu-latest
    env:
      VERSION: 0.0.0.dev${{ github.run_id }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run Python tests
        run: |
          python -m pip install ./host/python
          python -m unittest discover -s host/python/tests

      - name: Build and check development wheel
        run: |
          set -eu
          SETUPTOOLS_SCM_PRETEND_VERSION="$VERSION" python -m pip wheel --no-deps host/python --wheel-dir dist
          python -m venv build/development-check
          build/development-check/bin/pip install dist/*.whl
          cd build
          development-check/bin/suf2 --help > /dev/null
          development-check/bin/python -c \
            "import os; from importlib.metadata import version; assert version('suf2-host') == os.environ['VERSION']"

      - name: Upload development wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-development-distribution
          path: dist/*.whl
          if-no-files-found: error

  publish-test:
    name: Publish development wheel
    needs: test-package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/suf2-host/
    steps:
      - name: Download development wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-development-distribution
          path: dist

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
