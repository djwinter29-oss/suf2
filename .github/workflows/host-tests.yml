name: Host packers

on:
  push:
    paths:
      - 'host/**'
      - '.github/workflows/host-tests.yml'
  pull_request:
    paths:
      - 'host/**'
      - '.github/workflows/host-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python host package
        run: python -m pip install ./host/python
      - name: Python tests
        run: python -m unittest discover -s host/python/tests -v
      - name: Build .NET CLI
        run: dotnet build host/dotnet -c Release
      - name: .NET self-checks
        run: python host/dotnet/selfcheck.py
      - name: Dashboard tests
        working-directory: host/dashboard
        run: npm test
      - name: Cross-producer verification
        run: python -m unittest discover -s host/shared/tests -v
